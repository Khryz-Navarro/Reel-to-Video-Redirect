<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1c1e21; --muted:#65676b; --on:#1877f2; --off:#b0b3b8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#242526; --fg:#e4e6eb; --muted:#b0b3b8; --off:#4e4f50; } }
  body { margin:0; width:260px; padding:14px 16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .title { font-weight:600; }
  #status { margin:6px 0 0; color:var(--muted); font-size:12.5px; }
  .switch { position:relative; width:42px; height:24px; flex:none; }
  .switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
  .track { position:absolute; inset:0; border-radius:12px; background:var(--off); transition:background .15s; }
  .track::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
                  background:#fff; transition:transform .15s; }
  input:checked + .track { background:var(--on); }
  input:checked + .track::after { transform:translateX(18px); }
</style>
</head>
<body>
  <div class="row">
    <span class="title">Open reels as videos</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="track"></span>
    </label>
  </div>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
